[package]
name = "end-port"
version = "0.4.0"
edition = "2021"
description = "A tiny cross-platform tray utility for ending local development ports."
license = "MIT OR Apache-2.0"

[dependencies]
netstat2 = "0.11.2"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "=0.38.4"
tao = "0.35.3"
thiserror = "2.0.17"
tray-icon = "0.24.0"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
